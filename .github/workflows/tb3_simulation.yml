name: TurtleBot3 Gazebo CI/CD

on:
  push:
    branches:
      - turtlebot3_gazebo_ci
  pull_request:
    branches:
      - turtlebot3_gazebo_ci

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout the repository (to get the Dockerfile and scripts)
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2) Set up Docker BuildX
      - name: 🛠️ Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      # 3) Build the Docker image
      - name: 🏗️ Build Docker Image
        run: docker build -t tb3_sim ./docker

      # 4) Run the simulation container in headless mode (using the container’s entrypoint)
      - name: 🚀 Run Simulation in Headless Mode (Sanity Check)
        run: |
          docker run --rm --name tb3_sim \
            -e TURTLEBOT3_MODEL=burger \
            tb3_sim

      # 5) (Optional) Run a spawn test script
      - name: ✅ Run TurtleBot3 Spawn Test
        run: bash tests/test_robot_spawn.sh

      # 6) Clean up Docker
      - name: 🧹 Clean Up Docker
        if: always()
        run: docker system prune -f
